<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMDR BLS</title>
  <style>
    body { margin: 0; background: #000; overflow: hidden; }
    #info {
      position: absolute; top: 14px; width: 100%;
      text-align: center; color: #fff;
      font-family: Arial, sans-serif; font-size: 13px;
      pointer-events: none;
    }

    /* PIN entry screen — blocks the experience until connected to a specific therapist's room */
    #pinScreen {
      position: fixed; inset: 0; z-index: 50;
      display: flex; align-items: center; justify-content: center;
      background: #0a1622;
      font-family: Arial, sans-serif; direction: ltr;
    }
    #pinScreen.hidden { display: none; }
    #pinCard {
      width: min(86vw, 360px);
      background: #11222e; border: 1px solid #ffffff1a; border-radius: 20px;
      padding: 32px 28px; text-align: center; color: #fff;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    #pinCard h1 { margin: 0 0 6px; font-size: 20px; font-weight: 700; }
    #pinCard p { margin: 0 0 22px; font-size: 13px; color: #9bb4c0; line-height: 1.5; }
    #pinInput {
      width: 100%; box-sizing: border-box; text-align: center;
      font-size: 28px; font-weight: 700; letter-spacing: 8px;
      padding: 14px 0; border-radius: 12px; border: 1px solid #ffffff2a;
      background: #0a1622; color: #fff; margin-bottom: 14px;
    }
    #pinInput:focus { outline: none; border-color: #22d3ee; }
    #pinSubmit {
      width: 100%; padding: 14px 0; border-radius: 12px; border: none;
      background: #0891b2; color: #fff; font-size: 15px; font-weight: 700;
      cursor: pointer;
    }
    #pinSubmit:disabled { opacity: 0.5; cursor: default; }
    #pinError { margin-top: 12px; font-size: 13px; color: #f87171; min-height: 16px; }

    /* Subtle link to change room (visible only after connecting) */
    #changeRoom {
      position: fixed; bottom: 10px; inset-inline-end: 12px; z-index: 40;
      font-family: Arial, sans-serif; font-size: 11px; color: rgba(255,255,255,0.35);
      cursor: pointer; user-select: none;
    }
    #changeRoom.hidden { display: none; }
  </style>
</head>
<body>
  <div id="info">EMDR BLS | Press "Enter VR"</div>

  <div id="pinScreen">
    <div id="pinCard">
      <h1>EMDR BLS</h1>
      <p>Enter the 4-digit PIN shown on your therapist's dashboard to connect to the room.</p>
      <input id="pinInput" type="tel" inputmode="numeric" maxlength="4" placeholder="0000" autocomplete="off">
      <button id="pinSubmit" type="button">Connect</button>
      <div id="pinError"></div>
    </div>
  </div>
  <div id="changeRoom" class="hidden">Change PIN code</div>

  <script type="importmap">
  {
    "imports": {
      "three":         "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { VRButton } from 'three/addons/webxr/VRButton.js';

    // ══════════════════════════════════════════
    //  Firebase — database base URL
    // ══════════════════════════════════════════
    const DB = 'https://emdr-bls-b9cd1-default-rtdb.firebaseio.com';

    // ══════════════════════════════════════════
    //  Central state — updated from the dashboard via Firebase
    // ══════════════════════════════════════════
    const S = {
      running:    true,
      speed:      5,            // 1–9
      swing:      5,            // 1–9 movement width
      height:     0,            // -5 to +5
      size:       5,            // 1–9
      color:      '#5599ff',
      pattern:    'horizontal', // 'horizontal' | 'figure8'
      visual:     true,
      audio:      true,
      audioVolume: 5,           // 1–9 volume of the BLS "tick" sound
      haptic:     true,
      hapticStrength: 5,        // 1–9 vibration strength
      env:        'sky',        // background environment
      music:      'off',        // 'off' | '1' | '2' | '3'
      musicVolume: 5,           // 0–9
      hapticOnly: false,
      iwText:     '',           // interweave text to show the patient ('' = none)
      iwSeq:      0,            // bumped on every send/hide → triggers fade in/out
      sessionSeq: 0,            // bumped on reset → resets phase/reps
      setSeq:     0,            // bumped on every play → resets phase/reps (new set)
    };

    // converting scale values to physical values
    const toSpeed  = l => 0.2  + (l - 1) * 0.150;
    const toSwing  = l => 0.30 + (l - 1) * 0.175;
    const toHeight = h => h * 0.10;
    const toScale  = l => 0.40 + (l - 1) * 0.150;

    // ══════════════════════════════════════════
    //  Three.js
    // ══════════════════════════════════════════
    const scene    = new THREE.Scene();
    const camera   = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true });

    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    renderer.xr.enabled = true;
    renderer.xr.setReferenceSpaceType('local'); // 0 = eye height
    document.body.appendChild(renderer.domElement);
    document.body.appendChild(VRButton.createButton(renderer));

    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const sun = new THREE.DirectionalLight(0xffffff, 1.1);
    sun.position.set(2, 4, 3);
    scene.add(sun);

    // ══════════════════════════════════════════
    //  Background environment — giant inverted sphere with a gradient
    //  (generated in code, no heavy files)
    // ══════════════════════════════════════════
    const ENVIRONMENTS = {
      room:    { top: '#d9c9b0', bottom: '#8a7355', clear: 0xb9a685 }, // calm room
      nature:  { top: '#9fd4e8', bottom: '#5a8f4e', clear: 0x86b97a }, // nature scenery
      beach:   { top: '#aee4f0', bottom: '#e8d6a8', clear: 0xbfe0e6 }, // beach
      sky:     { top: '#3a7bd5', bottom: '#bfe3ff', clear: 0x87CEEB }, // sky
      neutral: { top: '#5a5a66', bottom: '#23232b', clear: 0x33333b }, // neutral
    };

    // creates a vertical gradient texture on a canvas
    function makeGradientTexture(top, bottom) {
      const c = document.createElement('canvas');
      c.width = 16; c.height = 256;
      const g = c.getContext('2d');
      const grad = g.createLinearGradient(0, 0, 0, 256);
      grad.addColorStop(0, top);
      grad.addColorStop(1, bottom);
      g.fillStyle = grad;
      g.fillRect(0, 0, 16, 256);
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    // inverted sphere wrapping the patient (BackSide = seen from inside)
    const skyMat  = new THREE.MeshBasicMaterial({ side: THREE.BackSide });
    const skyDome = new THREE.Mesh(new THREE.SphereGeometry(30, 64, 32), skyMat);
    scene.add(skyDome);

    // 360 photo backgrounds — loaded from the backgrounds/ folder (any env value that isn't a color wash)
    const texLoader  = new THREE.TextureLoader();
    const photoCache = {};       // id → THREE.Texture (loaded only once)
    let   currentEnv = null;     // the currently shown background — prevents reloading on every update

    // Tuning the seam of the 360° background photos so it falls behind the head.
    // 0.25 moved the seam to right in front of the eyes (wrong half-turn) → an extra +0.5 (0.75) brings it to the exact opposite side.
    const PHOTO_SEAM_OFFSET = 0.75;

    function setGradient(e) {
      if (skyMat.map && skyMat.map.isCanvasTexture) skyMat.map.dispose();
      skyMat.map = makeGradientTexture(e.top, e.bottom);
      skyMat.needsUpdate = true;
      renderer.setClearColor(e.clear);
    }

    function applyEnv(name) {
      if (name === currentEnv) return;     // no real change → don't reload
      currentEnv = name;
      // code-generated color wash
      if (ENVIRONMENTS[name]) { setGradient(ENVIRONMENTS[name]); return; }
      // photo background — from cache if already loaded
      if (photoCache[name]) {
        skyMat.map = photoCache[name]; skyMat.needsUpdate = true;
        renderer.setClearColor(0x000000);
        return;
      }
      // first load (async)
      texLoader.load(`backgrounds/${name}.jpg`, tex => {
        tex.colorSpace = THREE.SRGBColorSpace;
        // The seam in the 360° photos sits at a rotation not synced with the forward view direction —
        // we rotate the texture horizontally so the seam falls behind the head, not in the field of view.
        tex.wrapS = THREE.RepeatWrapping;
        tex.offset.x = PHOTO_SEAM_OFFSET;
        photoCache[name] = tex;
        if (currentEnv === name) {          // still the selected background?
          skyMat.map = tex; skyMat.needsUpdate = true;
          renderer.setClearColor(0x000000);
        }
      }, undefined, () => { setGradient(ENVIRONMENTS.neutral); currentEnv = null; });
    }
    applyEnv(S.env);

    // ══════════════════════════════════════════
    //  Ball — target values + smooth transition (lerp)
    // ══════════════════════════════════════════
    const sphere = new THREE.Mesh(
      new THREE.SphereGeometry(0.15, 32, 32),
      new THREE.MeshStandardMaterial({ color: S.color, roughness: 0.4, metalness: 0.1 })
    );
    sphere.position.set(0, toHeight(S.height), -1.5);
    sphere.scale.setScalar(toScale(S.size));
    scene.add(sphere);

    // target values the ball gently "crawls" toward
    const target = {
      scale:  toScale(S.size),
      posY:   toHeight(S.height),
      color:  new THREE.Color(S.color),
    };

    // ══════════════════════════════════════════
    //  Audio — a short "tick" at each edge
    // ══════════════════════════════════════════
    let audioCtx = null;
    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    function playTick(side) {
      if (!audioCtx || !S.running || !S.audio) return;
      const peak = (S.audioVolume / 9) * 0.9;   // 1–9 → volume
      if (peak < 0.005) return;                 // volume 0 → silent
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      const panner = new StereoPannerNode(audioCtx, { pan: side === 'right' ? 1 : -1 });
      osc.type = 'sine';
      osc.frequency.value = 440;
      const t = audioCtx.currentTime;
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(peak, t + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
      osc.connect(panner); panner.connect(gain); gain.connect(audioCtx.destination);
      osc.start(t); osc.stop(t + 0.13);
    }

    // ══════════════════════════════════════════
    //  Background music — a file from the music/ folder
    // ══════════════════════════════════════════
    let musicEl = null;     // the current <audio> element
    let musicId = 'off';    // which track is loaded

    function applyMusic() {
      // stop if turned off or the selection changed
      if (S.music === 'off' || S.music !== musicId) {
        if (musicEl) { musicEl.pause(); musicEl = null; }
        musicId = 'off';
      }
      // volume (0–9 → 0.0–1.0)
      const vol = Math.max(0, Math.min(1, S.musicVolume / 9));
      // load and play the selected track
      if (S.music !== 'off' && S.music !== musicId) {
        musicEl = new Audio(`music/${S.music}.mp3`);
        musicEl.loop = true;
        musicEl.volume = vol;
        musicEl.play().catch(() => {}); // missing file / autoplay blocked → ignored
        musicId = S.music;
      }
      if (musicEl) musicEl.volume = vol;
    }

    // resuming audio requires a user gesture
    function resumeAudio() {
      if (!audioCtx) initAudio();
      else if (audioCtx.state === 'suspended') audioCtx.resume();
      applyMusic();
    }
    document.addEventListener('click', resumeAudio);
    renderer.xr.addEventListener('sessionstart', resumeAudio);

    // ══════════════════════════════════════════
    //  Alternating vibration
    // ══════════════════════════════════════════
    function pulseHaptic(side) {
      if (!S.haptic) return;
      const session = renderer.xr.getSession();
      if (!session) return;
      for (const src of session.inputSources) {
        if (src.handedness === side && src.gamepad?.hapticActuators?.length > 0) {
          const strength = Math.max(0.1, Math.min(1, S.hapticStrength / 9));
          src.gamepad.hapticActuators[0].pulse(strength, 150);
        }
      }
    }

    // ══════════════════════════════════════════
    //  Interweaves — a floating text panel (CanvasTexture)
    //  Fades in, holds for a duration based on text length, fades out.
    //  Positioned above the ball's path so it doesn't hide it.
    // ══════════════════════════════════════════
    const iw = {
      seq: 0,          // the last iwSeq that was handled
      synced: false,   // whether synced against the first state from Firebase (prevents old text flashing on refresh)
      opacity: 0,      // current opacity (animated)
      target: 0,       // opacity target (0 or 1)
      hideAt: 0,       // timestamp (ms) for auto-hide; 0 = none
      mesh: null, canvas: null, ctx: null, tex: null,
    };

    // rounded-corner rectangle (with a graceful fallback for older browsers)
    function roundRect(ctx, x, y, w, h, r) {
      if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
      ctx.beginPath();
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function buildInterweave() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 512;
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      const mat = new THREE.MeshBasicMaterial({
        map: tex, transparent: true, opacity: 0,
        depthWrite: false, depthTest: false, // always reads above the background
      });
      const mesh = new THREE.Mesh(new THREE.PlaneGeometry(1.6, 0.8), mat);
      mesh.position.set(0, 0.78, -2.0);  // above the ball (y≈0, z=-1.5) and slightly behind it
      mesh.renderOrder = 10;
      mesh.visible = false;
      scene.add(mesh);
      iw.canvas = canvas; iw.ctx = canvas.getContext('2d'); iw.tex = tex; iw.mesh = mesh;
    }
    buildInterweave();

    // draws the text on the canvas (line wrapping + a semi-transparent background panel)
    function drawInterweaveText(text) {
      const ctx = iw.ctx, W = iw.canvas.width, H = iw.canvas.height;
      ctx.clearRect(0, 0, W, H);
      const fontSize = 64;
      ctx.font = `700 ${fontSize}px Arial, sans-serif`;
      // Direction stays RTL regardless of UI language: the therapist can type and
      // send free-text interweaves in Hebrew during a live session, and this needs
      // to keep rendering correctly. Centered alignment below keeps English text
      // unaffected either way.
      ctx.direction = 'rtl';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      // line wrapping by max width
      const maxWidth = W - 140;
      const words = text.split(/\s+/);
      const lines = [];
      let line = '';
      for (const w of words) {
        const test = line ? line + ' ' + w : w;
        if (ctx.measureText(test).width > maxWidth && line) { lines.push(line); line = w; }
        else line = test;
      }
      if (line) lines.push(line);

      const lineH = fontSize * 1.32;
      const blockH = lines.length * lineH;
      let maxLineW = 0;
      lines.forEach(l => maxLineW = Math.max(maxLineW, ctx.measureText(l).width));

      // semi-transparent background panel sized to the text
      const padX = 64, padY = 44;
      const panelW = Math.min(W, maxLineW + padX * 2);
      const panelH = blockH + padY * 2;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      roundRect(ctx, (W - panelW) / 2, (H - panelH) / 2, panelW, panelH, 40);
      ctx.fill();

      // the text itself — white with a shadow for readability against any background
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(0,0,0,0.85)';
      ctx.shadowBlur = 10;
      let y = H / 2 - blockH / 2 + lineH / 2;
      for (const l of lines) { ctx.fillText(l, W / 2, y); y += lineH; }
      ctx.shadowBlur = 0;

      iw.tex.needsUpdate = true;
    }

    // reacts to an iwSeq change: new text → show; empty text → hide
    function applyInterweave() {
      if (!iw.synced) { iw.synced = true; iw.seq = S.iwSeq; return; } // a mid-session refresh doesn't flash old text
      if (S.iwSeq === iw.seq) return;
      iw.seq = S.iwSeq;
      const txt = (S.iwText || '').trim();
      if (txt) {
        drawInterweaveText(txt);
        iw.mesh.visible = true;
        iw.target = 1;
        // hold duration grows with text length (reading time), plus the fade-in
        const hold = Math.min(14000, 3500 + txt.length * 130);
        iw.hideAt = performance.now() + 1200 + hold;
      } else {
        iw.target = 0;     // manual hide command
        iw.hideAt = 0;
      }
    }

    // ══════════════════════════════════════════
    //  Firebase ← listens for commands from the dashboard
    //  Room-specific path (sessions/{roomId}) — roomId comes from the PIN screen below.
    //  The old architecture used a single global path (emdr.json); now every therapist
    //  gets a separate room, exactly like the new dashboard writes to.
    // ══════════════════════════════════════════
    let lastSessionSeq = S.sessionSeq;
    let lastSetSeq = S.setSeq;
    let roomId = null;
    let fbStream = null;
    let statusTimer = null;
    let phase = 0;   // motion phase — accumulates over time (fixes the jump bug)
    let reps  = 0;   // rep counter (full cycles) — placed here (not in the animation loop) because
                     // reportStatus(), which depends on it, may run synchronously already from the
                     // automatic (localStorage) connection above, before the code reaches the animation loop.

    function connectFirebase(id) {
      if (fbStream) fbStream.close();
      fbStream = new EventSource(`${DB}/sessions/${id}.json`);
      fbStream.addEventListener('put', e => {
        const { data } = JSON.parse(e.data);
        if (!data) return;
        Object.assign(S, data);
        applyAll();
      });
      fbStream.addEventListener('error', () => { /* reconnects automatically */ });
    }

    // applies all parameters after an update from the dashboard
    function applyAll() {
      target.scale = toScale(S.size);
      target.posY  = toHeight(S.height);
      target.color.set(S.color);
      sphere.visible = S.visual;
      applyEnv(S.env);
      applyMusic();
      applyInterweave();
      // session reset (reset button) or a new set starting (play) → resets phase and reps
      if (S.sessionSeq !== lastSessionSeq || S.setSeq !== lastSetSeq) {
        lastSessionSeq = S.sessionSeq;
        lastSetSeq = S.setSeq;
        phase = 0; reps = 0;
      }
    }

    // ══════════════════════════════════════════
    //  Firebase → status reporting (presence + reps) — per roomId
    // ══════════════════════════════════════════
    function reportStatus() {
      if (!roomId) return;
      fetch(`${DB}/status/${roomId}.json`, {
        method: 'PUT',
        body: JSON.stringify({ alive: Date.now(), reps, running: S.running }),
        headers: { 'Content-Type': 'application/json' },
      }).catch(() => {});
    }

    // ══════════════════════════════════════════
    //  PIN entry — resolves a PIN code to a roomId via pins/{pin}, and remembers it in localStorage
    //  so the headset connects automatically to the same room next time (same therapist, same headset).
    // ══════════════════════════════════════════
    const ROOM_STORAGE_KEY = 'emdrBlsRoomId';

    const pinScreen   = document.getElementById('pinScreen');
    const pinInput    = document.getElementById('pinInput');
    const pinSubmit   = document.getElementById('pinSubmit');
    const pinErrorEl  = document.getElementById('pinError');
    const changeRoomEl = document.getElementById('changeRoom');

    function startSession(id) {
      roomId = id;
      localStorage.setItem(ROOM_STORAGE_KEY, id);
      pinScreen.classList.add('hidden');
      changeRoomEl.classList.remove('hidden');
      connectFirebase(id);
      reportStatus();
      if (statusTimer) clearInterval(statusTimer);
      statusTimer = setInterval(reportStatus, 1000); // heartbeat every second
    }

    async function resolveRoomId(pin) {
      const res = await fetch(`${DB}/pins/${pin}.json`);
      return res.json(); // roomId (string) or null if the code doesn't exist
    }

    async function submitPin() {
      const pin = pinInput.value.trim();
      if (!/^\d{4}$/.test(pin)) {
        pinErrorEl.textContent = 'Please enter a 4-digit code.';
        return;
      }
      pinSubmit.disabled = true;
      pinErrorEl.textContent = '';
      try {
        const id = await resolveRoomId(pin);
        if (!id) {
          pinErrorEl.textContent = 'Code not found. Check with your therapist and try again.';
          return;
        }
        startSession(id);
      } catch {
        pinErrorEl.textContent = 'Connection error. Try again.';
      } finally {
        pinSubmit.disabled = false;
      }
    }

    pinSubmit.addEventListener('click', submitPin);
    pinInput.addEventListener('keydown', e => { if (e.key === 'Enter') submitPin(); });
    pinInput.addEventListener('input', () => {
      pinInput.value = pinInput.value.replace(/\D/g, '').slice(0, 4);
    });
    changeRoomEl.addEventListener('click', () => {
      localStorage.removeItem(ROOM_STORAGE_KEY);
      location.reload();
    });

    // auto-connect if a roomId was already saved from a previous session on this headset
    const savedRoomId = localStorage.getItem(ROOM_STORAGE_KEY);
    if (savedRoomId) startSession(savedRoomId);
    else pinInput.focus();

    // ══════════════════════════════════════════
    //  Controllers (backup without the dashboard)
    // ══════════════════════════════════════════
    [renderer.xr.getController(0), renderer.xr.getController(1)].forEach(ctrl => {
      ctrl.addEventListener('selectstart', () => { S.running = !S.running; });
      scene.add(ctrl);
    });

    // ══════════════════════════════════════════
    //  Animation loop
    // ══════════════════════════════════════════
    const clock = new THREE.Clock();
    let prevA = false, prevB = false;
    let hapticR = false, hapticL = false;

    renderer.setAnimationLoop(() => {
      const dt = clock.getDelta();

      // A/B buttons — speed change (backup without the dashboard)
      const session = renderer.xr.getSession();
      if (session) {
        for (const src of session.inputSources) {
          const gp = src.gamepad; if (!gp) continue;
          const aNow = gp.buttons[4]?.pressed ?? false;
          const bNow = gp.buttons[5]?.pressed ?? false;
          if (aNow && !prevA) S.speed = Math.min(9, S.speed + 1);
          if (bNow && !prevB) S.speed = Math.max(1, S.speed - 1);
          prevA = aNow; prevB = bNow;
        }
      }

      // smooth transition of scale/height/color toward target values
      const k = 1 - Math.pow(0.001, dt); // frame-rate-independent lerp
      sphere.scale.setScalar(THREE.MathUtils.lerp(sphere.scale.x, target.scale, k));
      sphere.position.y = THREE.MathUtils.lerp(sphere.position.y, target.posY, k);
      sphere.material.color.lerp(target.color, k);

      // smooth fade of the interweave panel (in/out) — independent of the ball's motion
      if (iw.mesh) {
        if (iw.hideAt && performance.now() >= iw.hideAt) { iw.target = 0; iw.hideAt = 0; }
        const fadeK = 1 - Math.pow(0.06, dt);   // ~1.2s for a full fade
        iw.opacity = THREE.MathUtils.lerp(iw.opacity, iw.target, fadeK);
        iw.mesh.material.opacity = iw.opacity;
        if (iw.target === 0 && iw.opacity < 0.01) iw.mesh.visible = false;
      }

      if (S.running) {
        const swing = toSwing(S.swing);

        // phase accumulation — a speed change alters rate, not position (no jump)
        const prevPhase = phase;
        phase += dt * toSpeed(S.speed) * Math.PI;

        // rep counting — every full cycle (2π) = one rep
        reps = Math.floor(phase / (Math.PI * 2));

        // position by movement pattern
        const x = Math.sin(phase) * swing;
        sphere.position.x = x;
        if (S.pattern === 'figure8') {
          // figure-8: Y oscillation at double frequency around the current height
          sphere.position.y = target.posY + Math.sin(phase * 2) * (swing * 0.4);
        }

        // audio + vibration trigger at the X extremes
        const zone = swing * 0.80;
        if (x > zone && !hapticR) {
          hapticR = true; hapticL = false;
          pulseHaptic('right'); playTick('right');
        } else if (x < -zone && !hapticL) {
          hapticL = true; hapticR = false;
          pulseHaptic('left'); playTick('left');
        }
      } else {
        // stop / end of set — slowly return the ball to center (X) instead of leaving it frozen off to the side
        const kReturn = 1 - Math.pow(0.3, dt); // ~2.5 seconds for a full return (intentionally slow)
        sphere.position.x = THREE.MathUtils.lerp(sphere.position.x, 0, kReturn);
        hapticR = false; hapticL = false; // the next set starts clean of the trigger zones
      }

      renderer.render(scene, camera);
    });

    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

  </script>
</body>
</html>
